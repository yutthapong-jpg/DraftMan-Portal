<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="manifest" href="manifest.json?v=2">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DraftMan">
    <meta name="theme-color" content="#4f46e5">
    <title>DraftMan Portal</title>
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js?v=2').then(reg => {
            console.log('SW registered');
          });
        });
      }

      // Handle Cross-Origin Session Storage
      window.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'SAVE_CREDENTIALS') {
              localStorage.setItem('pwa_email', event.data.email);
              localStorage.setItem('pwa_pass', event.data.password);
          } else if (event.data && event.data.type === 'REQUEST_CREDENTIALS') {
              const email = localStorage.getItem('pwa_email');
              const pass = localStorage.getItem('pwa_pass');
              const iframe = document.querySelector('iframe');
              if (iframe && iframe.contentWindow) {
                  iframe.contentWindow.postMessage({ type: 'PWA_CREDENTIALS', email: email, password: pass }, '*');
              }
          } else if (event.data && event.data.type === 'CLEAR_CREDENTIALS') {
              localStorage.removeItem('pwa_email');
              localStorage.removeItem('pwa_pass');
          }
      });
    </script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/a/macros/maximafurniture.com/s/AKfycbz3VKJ1uG1M82r3JdCJy6vQyIAShQr_NUrUjEMIdz9NeQcRuD6GCKECMn1s189aT7_NGg/exec"></iframe>
</body>
</html>
